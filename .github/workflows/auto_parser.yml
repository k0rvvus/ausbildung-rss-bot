name: Update Ausbildung RSS Feed

on:
  schedule:
    - cron: '0 * * * *' # Запуск автоматически каждый час
  workflow_dispatch:   # Эта строчка как раз включает кнопку ручного запуска

jobs:
  run-parser:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 feedgen

    - name: Run parser script
      run: python parser.py

    - name: Commit and push XML changes
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add feed.xml
        git commit -m "Auto-update RSS feed.xml" || echo "No changes to commit"
        git push
